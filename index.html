<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Fail Panitia Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .panitia-item { cursor: pointer; transition: all 0.2s; }
        .panitia-item:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .required-text::after { content: " *"; color: #ef4444; }
    </style>
</head>
<body>
    <div id="app-container" class="min-h-screen flex flex-col">
        <header id="app-header" class="bg-indigo-900 shadow-xl p-4 text-white flex justify-between items-center hidden no-print">
            <div class="flex items-center space-x-3">
                <img src="sppd.png" class="h-10 w-10 object-contain" alt="Logo" onerror="this.style.display='none'">
                <h1 class="text-xl font-bold tracking-tight">SPPD PANITIA DIGITAL</h1>
            </div>
            <div class="flex items-center space-x-6">
                <div class="text-right leading-tight">
                    <p class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest">Log Masuk Sebagai:</p>
                    <p id="user-display" class="text-sm font-bold text-white uppercase"></p>
                </div>
                <button id="logout-button" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-4 rounded-lg transition duration-300 shadow-md">
                    LOG KELUAR
                </button>
            </div>
        </header>

        <main class="flex-grow p-6">
            <div id="loader" class="flex flex-col items-center justify-center mt-20 text-gray-600">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                <p class="mt-4 font-medium">Menyemak profil pengguna...</p>
            </div>

            <div id="auth-view" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-2xl mt-10 hidden border-t-4 border-indigo-600"></div>
            <div id="content-view" class="hidden w-full max-w-7xl mx-auto"></div>
        </main>

        <div id="modal-container">
            <div id="crud-modal" class="fixed inset-0 bg-gray-900 bg-opacity-80 hidden items-center justify-center z-50 p-4" onclick="closeModal('crud-modal')">
                <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg mx-auto transform transition-all" onclick="event.stopPropagation()">
                    <h2 id="modal-title" class="text-xl font-bold mb-4 text-indigo-800">Tambah Item Baru</h2>
                    <form id="crud-form" class="space-y-4">
                        <input type="hidden" id="item-id">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 required-text">Tajuk Dokumen</label>
                            <input type="text" id="item-title" required class="mt-1 block w-full rounded-xl border-gray-300 shadow-sm p-3 border focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 required-text">Tarikh</label>
                                <input type="date" id="item-date" required class="mt-1 block w-full rounded-xl border-gray-300 shadow-sm p-3 border focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700">Nota/Penerangan</label>
                            <textarea id="item-content" rows="3" class="mt-1 block w-full rounded-xl border-gray-300 shadow-sm p-3 border focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                        </div>
                        <div class="p-4 bg-indigo-50 rounded-xl border-2 border-dashed border-indigo-200">
                            <label class="block text-sm font-bold text-indigo-700 mb-2">Muat Naik Fail</label>
                            <input type="file" id="item-file" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                        </div>
                        <div class="flex justify-end space-x-3 pt-4">
                            <button type="button" onclick="closeModal('crud-modal')" class="px-6 py-2 text-sm font-bold text-gray-500 hover:text-gray-700">BATAL</button>
                            <button type="submit" id="save-button" class="px-8 py-2 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-lg">SIMPAN DATA</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="confirm-modal" class="fixed inset-0 bg-gray-900 bg-opacity-80 hidden items-center justify-center z-50 p-4" onclick="closeModal('confirm-modal')">
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-auto shadow-2xl">
                    <h3 class="text-lg font-bold mb-2 text-red-600">Padam Item?</h3>
                    <p id="confirm-message" class="text-gray-600 mb-6">Tindakan ini tidak boleh diundur.</p>
                    <div class="flex justify-end space-x-3">
                        <button onclick="closeModal('confirm-modal')" class="px-4 py-2 font-bold text-gray-400">BATAL</button>
                        <button id="confirm-action-button" class="px-6 py-2 bg-red-600 text-white font-bold rounded-xl shadow-lg">SAHKAN PADAM</button>
                    </div>
                </div>
            </div>

            <div id="message-modal" class="fixed inset-0 bg-gray-900 bg-opacity-80 hidden items-center justify-center z-50 p-4" onclick="closeModal('message-modal')">
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-auto shadow-2xl text-center">
                    <div id="message-icon" class="text-5xl mb-4">✅</div>
                    <h3 id="message-title" class="text-xl font-bold mb-2">Berjaya!</h3>
                    <p id="message-text" class="text-gray-600 mb-6"></p>
                    <button onclick="closeModal('message-modal')" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">TUTUP</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, onSnapshot, collection, query, where, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Konfigurasi asal anda
        const firebaseConfig = {
            apiKey: "AIzaSyD834R5Au1ksM0h-G0imluipJIN1br2g2g", 
            authDomain: "panitia-5be3a.firebaseapp.com",
            projectId: "panitia-5be3a",
            storageBucket: "panitia-5be3a.firebasestorage.app",
            messagingSenderId: "814796521590",
            appId: "1:814796521590:web:c0e31fa985401bcc571f57"
        };
        const appId = "panitia-5be3a";

        let isLoginMode = true;
        let app, db, auth, storage;
        let userId = null;
        let currentPanitia = null;
        let currentFolder = null;
        let activeSnapshotUnsubscribe = null;

        const panitiaList = ["Panitia Bahasa Melayu", "Panitia Bahasa Inggeris", "Panitia Matematik", "Panitia Sains", "Panitia Pendidikan Agama Islam", "Panitia Muzik", "Panitia Pendidikan Jasmani Kesihatan", "Panitia Sejarah", "Panitia Bahasa Arab", "Panitia Reka Bentuk Teknologi"];
        const folderList = [
            { name: "Fail Induk", icon: "📋" },
            { name: "Sukatan Pelajaran / DSKP", icon: "📚" },
            { name: "Mesyuarat Panitia", icon: "🗓️" },
            { name: "Program Kecemerlangan", icon: "🚀" },
            { name: "Peperiksaan & Pentaksiran", icon: "📝" },
            { name: "Penyeliaan & Pencerapan", icon: "👀" },
            { name: "Penyemakan Buku Latihan", icon: "🖍️" }
        ];

        const getCollectionPath = () => `/artifacts/${appId}/public/data/panitia_items`;

        async function initializeAppAndAuth() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app);

                onAuthStateChanged(auth, async (user) => {
                    document.getElementById('loader').classList.add('hidden');
                    if (user) {
                        userId = user.uid;
                        
                        // --- BAHAGIAN PENTING: AMBIL NAMA DARI KOLEKSI 'pengguna' ---
                        try {
                            const userDocRef = doc(db, "pengguna", user.uid);
                            const userDocSnap = await getDoc(userDocRef);
                            
                            if (userDocSnap.exists()) {
                                const userData = userDocSnap.data();
                                document.getElementById('user-display').textContent = userData.nama || user.email;
                            } else {
                                // Jika dokumen tiada, paparkan emel sebagai fallback
                                document.getElementById('user-display').textContent = user.email;
                            }
                        } catch (err) {
                            console.error("Ralat ambil nama:", err);
                            document.getElementById('user-display').textContent = user.email;
                        }

                        document.getElementById('logout-button').classList.remove('hidden');
                        renderView('panitia-dashboard');
                    } else {
                        userId = null;
                        renderView('auth');
                    }
                });
            } catch (error) {
                console.error("Ralat inisialisasi:", error);
            }
        }

        // Fungsi Paparan (Render Views)
        window.renderView = function(viewName) {
            const contentView = document.getElementById('content-view');
            const authView = document.getElementById('auth-view');
            const appHeader = document.getElementById('app-header');
            contentView.classList.add('hidden');
            authView.classList.add('hidden');
            appHeader.classList.add('hidden');

            if (activeSnapshotUnsubscribe) { activeSnapshotUnsubscribe(); activeSnapshotUnsubscribe = null; }

            if (viewName === 'auth') {
                authView.classList.remove('hidden');
                renderAuthView();
            } else {
                appHeader.classList.remove('hidden');
                contentView.classList.remove('hidden');
                if (viewName === 'panitia-dashboard') renderPanitiaDashboard();
                if (viewName === 'panitia-view') renderPanitiaFolderView();
                if (viewName === 'folder-content') renderFolderContent();
            }
        }

        function renderAuthView() {
            const authView = document.getElementById('auth-view');
            authView.innerHTML = `
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-extrabold text-indigo-900">SPPD</h2>
                    <p class="text-gray-500 font-medium">${isLoginMode ? 'Log Masuk Sistem' : 'Daftar Akaun Baru'}</p>
                </div>
                <form id="auth-form" class="space-y-4">
                    <input type="email" id="email" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="E-mel">
                    <input type="password" id="password" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Kata Laluan">
                    <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                        ${isLoginMode ? 'MASUK SEKARANG' : 'DAFTAR AKAUN'}
                    </button>
                </form>
                <div class="mt-6 text-center">
                    <button onclick="toggleAuthMode()" class="text-sm font-bold text-indigo-600 hover:underline">
                        ${isLoginMode ? 'Tiada akaun? Daftar di sini' : 'Sudah berdaftar? Log masuk'}
                    </button>
                </div>
            `;
            document.getElementById('auth-form').onsubmit = handleAuth;
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('loader').classList.remove('hidden');
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Ralat Pengesahan: " + error.message);
                document.getElementById('loader').classList.add('hidden');
            }
        }

        window.toggleAuthMode = () => { isLoginMode = !isLoginMode; renderAuthView(); }

        function renderPanitiaDashboard() {
            const contentView = document.getElementById('content-view');
            contentView.innerHTML = `
                <div class="mb-10 text-center">
                    <h2 class="text-4xl font-black text-gray-900 uppercase tracking-tighter">PILIH PANITIA</h2>
                    <p class="text-gray-500 mt-2">Sila pilih panitia mata pelajaran untuk pengurusan fail.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="panitia-grid"></div>
            `;
            const grid = document.getElementById('panitia-grid');
            panitiaList.forEach(name => {
                const card = document.createElement('div');
                card.className = 'panitia-item bg-white p-8 rounded-2xl shadow-lg border-b-4 border-indigo-600 text-center';
                card.innerHTML = `<div class="text-4xl mb-4 text-indigo-600">📂</div><h3 class="font-bold text-gray-800 leading-tight">${name}</h3>`;
                card.onclick = () => { currentPanitia = name; renderView('panitia-view'); };
                grid.appendChild(card);
            });
        }

        function renderPanitiaFolderView() {
            const contentView = document.getElementById('content-view');
            contentView.innerHTML = `
                <button onclick="renderView('panitia-dashboard')" class="mb-6 font-bold text-indigo-600 flex items-center">← KEMBALI</button>
                <div class="bg-indigo-900 rounded-3xl p-8 mb-8 text-white shadow-2xl relative overflow-hidden">
                    <h2 class="text-3xl font-black relative z-10">${currentPanitia}</h2>
                    <p class="opacity-70 relative z-10 uppercase text-xs tracking-widest mt-2 font-bold italic text-yellow-400">PENGURUSAN FAIL DIGITAL</p>
                    <div class="absolute -right-10 -bottom-10 text-white opacity-10 text-[150px]">📁</div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="folder-grid"></div>
            `;
            const grid = document.getElementById('folder-grid');
            folderList.forEach(folder => {
                const card = document.createElement('div');
                card.className = 'panitia-item bg-white p-6 rounded-2xl shadow-lg flex items-center space-x-4 border border-gray-100';
                card.innerHTML = `<span class="text-3xl">${folder.icon}</span><div><h3 class="font-bold text-gray-800">${folder.name}</h3><p class="text-xs text-gray-400">Klik untuk lihat isi kandungan</p></div>`;
                card.onclick = () => { currentFolder = folder.name; renderView('folder-content'); };
                grid.appendChild(card);
            });
        }

        function renderFolderContent() {
            const contentView = document.getElementById('content-view');
            contentView.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <button onclick="renderView('panitia-view')" class="font-bold text-indigo-600 flex items-center">← KEMBALI KE FAIL</button>
                    <button onclick="openCrudModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-2xl shadow-xl flex items-center">
                        <span class="mr-2 text-xl">+</span> TAMBAH ITEM
                    </button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-indigo-600 uppercase tracking-widest mb-1">${currentPanitia}</p>
                            <h3 class="text-xl font-black text-gray-800">${currentFolder}</h3>
                        </div>
                    </div>
                    <ul id="content-list" class="divide-y divide-gray-100"></ul>
                </div>
            `;
            fetchContentRealtime();
        }

        function fetchContentRealtime() {
            const q = query(collection(db, getCollectionPath()), where("panitia", "==", currentPanitia), where("folder", "==", currentFolder));
            activeSnapshotUnsubscribe = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('content-list');
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = `<li class="p-10 text-center text-gray-400 italic font-medium">Tiada sebarang dokumen ditemui.</li>`;
                    return;
                }
                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    const li = document.createElement('li');
                    li.className = 'p-6 flex justify-between items-center hover:bg-indigo-50 transition';
                    const hasLink = item.content && item.content.startsWith('http');
                    li.innerHTML = `
                        <div class="flex-grow pr-4">
                            <h4 class="font-black text-gray-800 text-lg uppercase leading-tight mb-1">${item.title}</h4>
                            <div class="flex items-center space-x-3 text-xs">
                                <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">${item.date}</span>
                                <span class="text-gray-400 font-medium italic">Oleh: ${item.authorId ? 'Staf Panitia' : 'Sistem'}</span>
                            </div>
                            ${hasLink ? `<a href="${item.content}" target="_blank" class="mt-3 inline-block text-xs font-bold text-indigo-600 underline">LIHAT FAIL DOKUMEN</a>` : `<p class="mt-3 text-sm text-gray-600 line-clamp-2">${item.content || '-'}</p>`}
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="openCrudModal('edit', '${docSnap.id}', '${item.title.replace(/'/g, "\\'")}', '${item.date}', '${(item.content || '').replace(/'/g, "\\'")}')" class="p-2 bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100">✏️</button>
                            <button onclick="promptDeleteConfirmation('${docSnap.id}', '${item.title.replace(/'/g, "\\'")}')" class="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100">🗑️</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            });
        }

        // CRUD & Modals Logics (Sama seperti kod asal anda, cuma diperkemas)
        window.openCrudModal = function(mode, id = '', title = '', date = '', content = '') {
            const modal = document.getElementById('crud-modal');
            document.getElementById('modal-title').textContent = mode === 'add' ? 'Tambah Dokumen Baru' : 'Kemaskini Dokumen';
            document.getElementById('item-id').value = id;
            document.getElementById('item-title').value = title;
            document.getElementById('item-date').value = date || new Date().toISOString().split('T')[0];
            document.getElementById('item-content').value = content;
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }

        window.closeModal = (id) => { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        document.getElementById('crud-form').onsubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const title = document.getElementById('item-title').value;
            const date = document.getElementById('item-date').value;
            const content = document.getElementById('item-content').value;
            const file = document.getElementById('item-file').files[0];

            closeModal('crud-modal');
            document.getElementById('loader').classList.remove('hidden');

            let finalContent = content;
            if (file) {
                const storageRef = ref(storage, `panitia/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                finalContent = await getDownloadURL(storageRef);
            }

            const data = { panitia: currentPanitia, folder: currentFolder, title, date, content: finalContent, authorId: userId, updatedAt: new Date().toISOString() };

            try {
                if (id) await updateDoc(doc(db, getCollectionPath(), id), data);
                else await addDoc(collection(db, getCollectionPath()), data);
                showMessage('✅ Berjaya', 'Data telah disimpan ke dalam rekod panitia.');
            } catch (err) { alert(err.message); }
            finally { document.getElementById('loader').classList.add('hidden'); }
        }

        window.promptDeleteConfirmation = (id, title) => {
            document.getElementById('confirm-message').textContent = `Padam rekod "${title}"?`;
            document.getElementById('confirm-action-button').onclick = () => deleteItem(id);
            document.getElementById('confirm-modal').classList.replace('hidden', 'flex');
        }

        async function deleteItem(id) {
            closeModal('confirm-modal');
            await deleteDoc(doc(db, getCollectionPath(), id));
            showMessage('🗑️ Dipadam', 'Rekod telah dibuang daripada senarai.');
        }

        function showMessage(title, text) {
            document.getElementById('message-title').textContent = title;
            document.getElementById('message-text').textContent = text;
            document.getElementById('message-modal').classList.replace('hidden', 'flex');
        }

        document.getElementById('logout-button').onclick = () => signOut(auth);

        initializeAppAndAuth();
    </script>
</body>
</html>
